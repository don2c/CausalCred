[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalcred-eval"
version = "1.0.0"
description = "Deterministic CausalCred evaluation and table reproduction"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
docs = ["reportlab>=4.0,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
